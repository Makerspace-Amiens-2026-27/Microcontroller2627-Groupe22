; Programmes de test des modules (TD microcontrôleur)
; Chaque environnement compile UN seul fichier de src/.
; Choisir l'environnement dans la barre du bas de VSCode (env:...), puis ✓ / →.

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0

[env:serie_teleplot]
build_src_filter = -<*> +<serie_teleplot.cpp>

[env:bouton_niveau]
build_src_filter = -<*> +<bouton_niveau.cpp>

[env:bouton_antirebond]
build_src_filter = -<*> +<bouton_antirebond.cpp>

[env:joystick_brut]
build_src_filter = -<*> +<joystick_brut.cpp>

[env:joystick_normalise]
build_src_filter = -<*> +<joystick_normalise.cpp>

[env:buzzer]
build_src_filter = -<*> +<buzzer.cpp>

[env:ecran]
build_src_filter = -<*> +<ecran.cpp>

[env:test_global]
build_src_filter = -<*> +<test_global.cpp>

[env:dht11]
build_src_filter = -<*> +<dht11.cpp>

[env:son_ky037]
build_src_filter = -<*> +<son_ky037.cpp>

[env:laser_bouton]
build_src_filter = -<*> +<laser_bouton.cpp>
